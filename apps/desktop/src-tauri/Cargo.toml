[package]
name = "whatnull"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
open = "5.0"
base64 = "0.22"
whatnull_types = { path = "../../../crates/whatnull_types" }
whatnull_platform = { path = "../../../crates/whatnull_platform" }
whatnull_config = { path = "../../../crates/whatnull_config" }
whatnull_security = { path = "../../../crates/whatnull_security" }
whatnull_storage = { path = "../../../crates/whatnull_storage" }
whatnull_core = { path = "../../../crates/whatnull_core" }
whatnull_notification = { path = "../../../crates/whatnull_notification" }
whatnull_privacy = { path = "../../../crates/whatnull_privacy" }
